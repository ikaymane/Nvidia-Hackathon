finite" /></path><circle cx="710" cy="120" r="10" fill="#76b900" stroke="#fff" stroke-width="3"/><circle cx="710" cy="120" r="10" fill="none" stroke="#76b900" stroke-width="2"><animate attributeName="r" values="10;30" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.6s" repeatCount="indefinite"/></circle><text x="698" y="152" text-anchor="end" font-size="15" font-weight="700" fill="#e5e7eb">Gare Rabat Ville</text><g><circle r="18" fill="#22d3ee" opacity=".25"><animate attributeName="r" values="12;24;12" dur="1.4s" repeatCount="indefinite"/></circle><circle r="10" fill="#22d3ee" stroke="#fff" stroke-width="3"/><animateMotion dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.16;0.86;1" calcMode="linear"><mpath xlink:href="#route"/></animateMotion></g><rect x="60" y="24" width="660" height="66" rx="20" fill="#76b900"/><path d="M 92 72 L 92 52 Q 92 44 100 44 L 116 44 M 108 36 L 116 44 L 108 52" fill="none" stroke="#07080a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.160;0.170;0.390;0.400;1" dur="14s" repeatCount="indefinite" /><text x="140" y="56" font-size="26" font-weight="800" fill="#07080a">320 m</text><text x="140" y="79" font-size="16" font-weight="600" fill="#07080a">Turn right onto Avenue Mohammed V</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.400;0.410;0.630;0.640;1" dur="14s" repeatCount="indefinite" /><text x="140" y="56" font-size="26" font-weight="800" fill="#07080a">90 m</text><text x="140" y="79" font-size="16" font-weight="600" fill="#07080a">At the roundabout, take exit 2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.640;0.650;0.850;0.860;1" dur="14s" repeatCount="indefinite" /><text x="140" y="56" font-size="26" font-weight="800" fill="#07080a">40 m</text><text x="140" y="79" font-size="16" font-weight="600" fill="#07080a">Your destination is on the left</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.86;0.87;0.96;1" dur="14s" repeatCount="indefinite" /><rect x="60" y="24" width="660" height="66" rx="20" fill="#76b900"/><text x="92" y="66" font-size="26" font-weight="800" fill="#07080a">You've arrived. Nice drive!</text></g><rect x="60" y="428" width="660" height="56" rx="18" fill="#0d0e12" stroke="#ffffff" stroke-opacity=".1"/><rect x="96" y="456" width="4" height="10" rx="2" fill="#76b900"><animate attributeName="height" values="4;14;6;12;4" dur="0.80s" repeatCount="indefinite"/><animate attributeName="y" values="463;453;461;455;463" dur="0.80s" repeatCount="indefinite"/></rect><rect x="102" y="456" width="4" height="10" rx="2" fill="#76b900"><animate attributeName="height" values="4;14;6;12;4" dur="0.97s" repeatCount="indefinite"/><animate attributeName="y" values="463;453;461;455;463" dur="0.97s" repeatCount="indefinite"/></rect><rect x="108" y="456" width="4" height="10" rx="2" fill="#76b900"><animate attributeName="height" values="4;14;6;12;4" dur="1.14s" repeatCount="indefinite"/><animate attributeName="y" values="463;453;461;455;463" dur="1.14s" repeatCount="indefinite"/></rect><rect x="114" y="456" width="4" height="10" rx="2" fill="#76b900"><animate attributeName="height" values="4;14;6;12;4" dur="1.31s" repeatCount="indefinite"/><animate attributeName="y" values="463;453;461;455;463" dur="1.31s" repeatCount="indefinite"/></rect><text x="130" y="466" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" fill="#8b8d98">road mix</text><text x="700" y="464" text-anchor="end" font-size="22" font-weight="800" fill="#76b900">6 min<tspan font-size="14" font-weight="400" fill="#8b8d98">  ·  3.9 km</tspan></text><text x="800" y="60" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" letter-spacing="3" fill="#8b8d98">CO-PILOT · NEMOTRON NANO</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.220;0.260;0.950;0.990;1" dur="14s" repeatCount="indefinite" /><rect x="800" y="86" width="300" height="74" rx="18" fill="#0f1a00" stroke="#76b900" stroke-opacity=".45"/><text x="818" y="116" font-size="16" fill="#f3f4f6">Off to the station? Where is the</text><text x="818" y="138" font-size="16" fill="#f3f4f6">train taking you today?</text><text x="818" y="178" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#8b8d98">Vox</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.420;0.460;0.950;0.990;1" dur="14s" repeatCount="indefinite" /><rect x="850" y="194" width="300" height="52" rx="18" fill="#1d1f26" stroke="#ffffff" stroke-opacity=".45"/><text x="868" y="224" font-size="16" fill="#f3f4f6">Fès, to see my family.</text><text x="1132" y="264" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#8b8d98">you</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.560;0.600;0.950;0.990;1" dur="14s" repeatCount="indefinite" /><rect x="800" y="280" width="300" height="74" rx="18" fill="#0f1a00" stroke="#76b900" stroke-opacity=".45"/><text x="818" y="310" font-size="16" fill="#f3f4f6">Nice! How long will you stay in</text><text x="818" y="332" font-size="16" fill="#f3f4f6">Fès?</text><text x="818" y="372" text-anchor="start" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#8b8d98">Vox</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.700;0.740;0.950;0.990;1" dur="14s" repeatCount="indefinite" /><rect x="850" y="388" width="300" height="52" rx="18" fill="#1d1f26" stroke="#ffffff" stroke-opacity=".45"/><text x="868" y="418" font-size="16" fill="#f3f4f6">Just the weekend.</text><text x="1132" y="458" text-anchor="end" font-family="'Jet