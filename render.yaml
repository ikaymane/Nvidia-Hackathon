# Render Blueprint: the whole app (React + FastAPI) as one Docker web service on the
# free plan (no card needed). Free services have no disk, so tasks reset when the service
# restarts, and they sleep after 15 idle minutes (the first visit then takes ~50 s).
# Deploy: https://dashboard.render.com/blueprint/new?repo=https://github.com/ikaymane/Nvidia-Hackathon
services:
  - type: web
    name: vox
    runtime: docker
    plan: free
    region: frankfurt        # closest Render region to Morocco
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/state
    autoDeploy: true         # every push to main redeploys
    envVars:
      - key: NEBIUS_API_KEY
        sync: false          # Render asks for it once; it is never stored in the repo
